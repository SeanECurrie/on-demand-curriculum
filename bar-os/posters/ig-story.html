<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monday Bags — IG Story (9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#dd3333; --red-l:#ff5247; --white:#f9f9f9; --cream:#f1ead8;
    --green:#75d69c; --muted:#b2aca1; --ink:#070707;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;font-family:'Poppins',sans-serif}

  .story{
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:#070707;color:var(--white);
    display:flex;flex-direction:column;
    /* top 150 + bottom 250 keep critical content out of IG story UI safe zones */
    padding:158px 78px 252px;
  }

  /* ── full-bleed photo ── */
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 42%;filter:brightness(.6) saturate(1.08);z-index:0}
  .grad{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(7,7,7,.78) 0%,rgba(7,7,7,.28) 20%,rgba(7,7,7,.14) 44%,
        rgba(7,7,7,.52) 66%,rgba(7,7,7,.92) 86%,#070707 100%),
      radial-gradient(62% 42% at 28% 86%,rgba(221,51,51,.20),transparent 70%),
      radial-gradient(52% 30% at 82% 10%,rgba(117,214,156,.08),transparent 70%)}
  /* brand dot texture */
  .dots{position:absolute;inset:0;z-index:2;opacity:.4;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0);
    background-size:26px 26px}
  /* brand vignette */
  .vig{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(78% 64% at 50% 46%,transparent 52%,rgba(7,7,7,.55) 100%)}

  /* ── top: logo + context eyebrow ── */
  .top{position:relative;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
  .top img{width:104px;height:auto;object-fit:contain;filter:drop-shadow(0 3px 16px rgba(0,0,0,.85))}
  .eyebrow{font-weight:700;font-size:25px;letter-spacing:.24em;text-transform:uppercase;color:var(--red-l);
    display:flex;align-items:center;gap:15px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--red),transparent)}

  /* ── middle: the one big hook ── */
  .hook{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
  .hook .big{font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.025em;text-transform:uppercase;
    text-shadow:0 6px 40px rgba(0,0,0,.85);max-width:9ch}
  .hook .scr{font-family:'Kaushan Script',cursive;font-weight:400;color:var(--green);
    font-size:82px;line-height:1;margin-top:18px;transform:rotate(-3deg);transform-origin:left center;
    text-shadow:0 4px 26px rgba(0,0,0,.7)}

  /* ── bottom: details + share mechanic ── */
  .bottom{position:relative;z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:26px}
  .when{font-weight:800;font-size:32px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);
    display:flex;align-items:center;gap:14px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .when .dot{color:var(--red)}
  .share{display:inline-flex;align-items:center;gap:18px;
    padding:20px 32px;border:2px solid rgba(117,214,156,.55);border-radius:18px;
    background:linear-gradient(180deg,rgba(117,214,156,.12),rgba(117,214,156,.03));
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .share .txt{font-weight:800;font-size:42px;line-height:1;letter-spacing:-.01em;color:#fff}
  .share .txt b{color:var(--green);font-weight:800}
  .share .arw{font-weight:900;font-size:44px;line-height:1;color:var(--green)}
  .handle{display:flex;align-items:center;gap:16px;margin-top:2px}
  .handle img{width:34px;height:auto;opacity:.92}
  .handle span{font-weight:600;font-size:25px;letter-spacing:.06em;color:#cfcabf}
  .handle span b{color:#fff;font-weight:700}
</style>
</head>
<body>
<div class="story">
  <img class="bg" src="../../site/assets/photos/crowd.jpeg" alt="">
  <div class="grad"></div>
  <div class="dots"></div>
  <div class="vig"></div>

  <div class="top">
    <img src="../../site/assets/logo.png" alt="Clover River West">
    <div class="eyebrow">Monday Bags · River West</div>
  </div>

  <div class="hook">
    <div class="big">Show up alone.</div>
    <div class="scr">We draw you a partner.</div>
  </div>

  <div class="bottom">
    <div class="when">Mondays <span class="dot">·</span> sign up by 7 <span class="dot">·</span> just walk in</div>
    <div class="share">
      <span class="txt">tag your <b>Monday crew</b></span>
      <span class="arw">&rarr;</span>
    </div>
    <div class="handle">
      <img src="../../site/assets/clover-icon.png" alt="">
      <span><b>@cloverchicago</b> · 722 W Grand</span>
    </div>
  </div>
</div>
</body>
</html>
