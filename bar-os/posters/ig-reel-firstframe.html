<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monday Bags — IG Reel First Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#dd3333; --red-l:#ff5247; --white:#f9f9f9; --cream:#f1ead8;
    --green:#75d69c; --muted:#b2aca1; --ink:#070707;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;font-family:'Poppins',sans-serif}

  /* ── exact 9:16 root ── */
  .frame{
    width:1080px;height:1920px;position:relative;overflow:hidden;
    background:#070707;color:var(--white);
  }

  /* ── full-bleed photo ── */
  .frame > img.bg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:54% 42%;
    filter:brightness(.72) saturate(1.05) contrast(1.04);
  }
  /* legibility + brand glow */
  .frame::before{content:"";position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(7,7,7,.72) 0%,rgba(7,7,7,.16) 26%,rgba(7,7,7,.18) 52%,rgba(7,7,7,.84) 84%,#070707 100%),
      radial-gradient(62% 40% at 50% 96%,rgba(221,51,51,.20),transparent 70%),
      radial-gradient(60% 34% at 50% 0%,rgba(221,51,51,.12),transparent 72%)}
  /* film grain */
  .frame::after{content:"";position:absolute;inset:0;z-index:2;opacity:.5;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.03) 1px,transparent 0);background-size:26px 26px}

  /* ── top brand ── */
  .top{position:absolute;top:84px;left:0;right:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:22px}
  .top img{width:150px;height:auto;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,.85))}
  .eyebrow{font-weight:700;font-size:30px;letter-spacing:.28em;text-transform:uppercase;color:var(--red-l);
    display:flex;align-items:center;gap:18px}
  .eyebrow::before,.eyebrow::after{content:"";width:46px;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
  .eyebrow::after{background:linear-gradient(90deg,var(--red),transparent)}

  /* ── the hook (lower third, clear of IG UI) ── */
  .hook{position:absolute;left:74px;right:74px;bottom:300px;z-index:5;text-align:left}
  .pov{font-weight:800;font-size:60px;letter-spacing:.04em;text-transform:uppercase;color:var(--red-l);
    margin-bottom:14px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
  .line{font-weight:900;font-size:158px;line-height:.82;letter-spacing:-.02em;text-transform:uppercase;color:#fff;
    text-shadow:0 8px 40px rgba(0,0,0,.72)}
  .line .red{color:var(--red)}
  .promise{margin-top:30px;font-family:'Kaushan Script',cursive;font-weight:400;font-size:74px;line-height:1;
    color:var(--green);transform:rotate(-3deg);transform-origin:left center;
    text-shadow:0 4px 22px rgba(0,0,0,.6)}

  /* ── bottom handle strip ── */
  .strip{position:absolute;left:0;right:0;bottom:96px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px}
  .strip .bar{width:170px;height:4px;background:linear-gradient(90deg,transparent,var(--red),transparent);border-radius:4px}
  .strip .h{font-weight:800;font-size:30px;letter-spacing:.05em;text-transform:uppercase;color:#fff}
  .strip .h b{color:var(--green);font-weight:800}
  .strip .h .dot{color:var(--muted);margin:0 14px;font-weight:600}
</style>
</head>
<body>
<div class="frame">
  <img class="bg" src="../../site/assets/photos/crowd.jpeg" alt="">

  <div class="top">
    <img src="../../site/assets/logo.png" alt="Clover River West">
    <div class="eyebrow">Monday Bags · River West</div>
  </div>

  <div class="hook">
    <div class="pov">POV:</div>
    <div class="line">you walked</div>
    <div class="line">in <span class="red">alone.</span></div>
    <div class="promise">we draw you a partner</div>
  </div>

  <div class="strip">
    <div class="bar"></div>
    <div class="h">@cloverchicago<span class="dot">·</span><b>#BAGSATCLOVER</b></div>
  </div>
</div>
</body>
</html>
